apiVersion: apps/v1
kind: Deployment

metadata:
  name: backend
  namespace: infrapilot

spec:
  replicas: 1

  selector:
    matchLabels:
      app: backend

  template:
    metadata:
      labels:
        app: backend

    spec:
      containers:
        - name: backend

          image: infrapilot-backend:latest

          imagePullPolicy: Never

          ports:
            - containerPort: 5000

          envFrom:
            - configMapRef:
                name: infrapilot-config

            - secretRef:
                name: infrapilot-secret