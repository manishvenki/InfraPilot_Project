version: "3.9"

services:

  jenkins:
    build:
      context: ../jenkins

    container_name: infrapilot-jenkins

    privileged: true

    user: root

    restart: unless-stopped

    ports:
      - "8081:8080"
      - "50000:50000"

    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock

    networks:
      - infrapilot-network

networks:
  infrapilot-network:
    driver: bridge

volumes:
  jenkins_home: